<!DOCTYPE html>
<html><head><meta charset='UTF-8'/>
<link href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap' rel='stylesheet'/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1080px;overflow:hidden;background:#0a1628;font-family:'Plus Jakarta Sans',sans-serif;}
.wrap{width:1080px;height:1080px;position:relative;background:linear-gradient(135deg,#06101f 0%,#102a4c 50%,#0a1e38 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;}
.blob1{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,#3b82f6,transparent);top:-120px;right:-80px;opacity:.1;filter:blur(80px);}
.blob2{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,#6366f1,transparent);bottom:-100px;left:-80px;opacity:.09;filter:blur(80px);}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.04) 1.5px,transparent 1.5px);background-size:40px 40px;}

.badge{background:#1e3a5f;border:1.5px solid #3b82f6;border-radius:100px;padding:12px 32px;color:#93c5fd;font-size:18px;font-weight:700;letter-spacing:2px;margin-bottom:32px;z-index:1;}

.logo-row{display:flex;align-items:center;gap:20px;margin-bottom:18px;z-index:1;}
.logo-icon{width:100px;height:100px;border-radius:22px;}
.logo-text{display:flex;flex-direction:column;}
.logo-word{font-size:62px;font-weight:800;letter-spacing:-2px;line-height:1;}
.logo-sub{font-size:18px;color:#64748b;font-weight:500;margin-top:6px;letter-spacing:.5px;}

.divider{width:700px;height:1.5px;background:linear-gradient(90deg,transparent,#3b82f6,transparent);margin:24px 0;z-index:1;}

.headline{text-align:center;z-index:1;margin-bottom:28px;}
.headline h1{font-size:64px;font-weight:800;color:#fff;letter-spacing:-2px;line-height:1.1;}
.headline h1 span{color:#60a5fa;}

.pills{display:flex;gap:16px;z-index:1;margin-bottom:32px;}
.pill{background:#0f1e33;border:1.5px solid #1e3a5f;border-radius:20px;padding:18px 28px;text-align:center;}
.pill-icon{font-size:28px;display:block;margin-bottom:8px;}
.pill-title{font-size:16px;font-weight:700;color:#e2e8f0;display:block;}
.pill-sub{font-size:13px;color:#475569;display:block;margin-top:4px;}

.url-row{background:#0f1e33;border:1.5px solid #1e3a5f;border-radius:16px;padding:16px 40px;z-index:1;margin-bottom:20px;}
.url-row p{font-size:22px;font-weight:600;color:#60a5fa;text-align:center;}

.flags{font-size:26px;letter-spacing:6px;z-index:1;color:#fff;}
</style></head>
