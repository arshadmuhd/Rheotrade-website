<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#102a4c"/>
      <stop offset="100%" style="stop-color:#0d2040"/>
    </linearGradient>

    <!-- Primary blue gradient for accents -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162d4a;stop-opacity:1"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow1">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Clip path for rounded rect -->
    <clipPath id="cardClip">
      <rect x="60" y="580" width="960" height="300" rx="32"/>
    </clipPath>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <circle cx="900" cy="150" r="300" fill="#3b82f6" opacity="0.08" filter="url(#glow1)"/>
  <circle cx="100" cy="900" r="280" fill="#6366f1" opacity="0.07" filter="url(#glow1)"/>
  <circle cx="540" cy="540" r="200" fill="#2563eb" opacity="0.04" filter="url(#glow1)"/>
  <circle cx="200" cy="200" r="160" fill="#22d3ee" opacity="0.05" filter="url(#glow1)"/>

  <!-- Grid dots pattern (subtle) -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.04"/>
  </pattern>
  <rect width="1080" height="1080" fill="url(#dots)"/>

  <!-- ── TOP BADGE ── -->
  <rect x="370" y="72" width="340" height="52" rx="26" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="540" y="104" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#93c5fd" letter-spacing="2">🚀  WE ARE LIVE</text>

  <!-- ── LOGO AREA ── -->
  <!-- R icon badge -->
  <rect x="438" y="155" width="90" height="90" rx="22" fill="#1a3a6b"/>
  <rect x="438" y="155" width="90" height="90" rx="22" fill="url(#blueGrad)" opacity="0.3"/>
  <!-- R letter -->
  <text x="483" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" fill="#60a5fa">R</text>

  <!-- Rheotrade wordmark -->
  <text x="540" y="295" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
    <tspan fill="#60a5fa">Rheo</tspan><tspan fill="#e2e8f0">trade</tspan>
  </text>

  <!-- Tagline -->
  <text x="540" y="345" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="500" fill="#94a3b8" letter-spacing="0.5">Complete Accounting + Trading Platform</text>

  <!-- ── DIVIDER LINE ── -->
  <line x1="180" y1="382" x2="900" y2="382" stroke="url(#blueGrad)" stroke-width="1" opacity="0.3"/>

  <!-- ── HEADLINE ── -->
  <text x="540" y="455" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-2">Run your entire</text>

  <text x="540" y="530" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="68" font-weight="800" letter-spacing="-2">
    <tspan fill="#60a5fa">business</tspan>
    <tspan fill="#ffffff"> in one flow.</tspan>
  </text>

  <!-- ── BOTTOM CARD ── -->
  <rect x="60" y="588" width="960" height="290" rx="32" fill="url(#cardGrad)" stroke="#1e40af" stroke-width="1.5" opacity="0.9"/>

  <!-- Three value pills inside card -->
  <!-- Pill 1 -->
  <rect x="100" y="630" width="270" height="90" rx="16" fill="#0f2a4a"/>
  <text x="235" y="666" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="26">📊</text>
  <text x="235" y="696" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Accounts &amp; Sales</text>
  <text x="235" y="714" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#64748b">Connected, always accurate</text>

  <!-- Pill 2 -->
  <rect x="405" y="630" width="270" height="90" rx="16" fill="#0f2a4a"/>
  <text x="540" y="666" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="26">🏛️</text>
  <text x="540" y="696" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">GST &amp; VAT Built In</text>
  <text x="540" y="714" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#64748b">India + GCC compliant</text>

  <!-- Pill 3 -->
  <rect x="710" y="630" width="270" height="90" rx="16" fill="#0f2a4a"/>
  <text x="845" y="666" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="26">🌐</text>
  <text x="845" y="696" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">7 Countries</text>
  <text x="845" y="714" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#64748b">INR · AED · SAR · BHD</text>

  <!-- Divider inside card -->
  <line x1="100" y1="752" x2="980" y2="752" stroke="#1e3a5f" stroke-width="1"/>

  <!-- URL row -->
  <text x="540" y="800" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="600" fill="#93c5fd" letter-spacing="0.5">🔗  rheotrade.arshadmuhd.com</text>

  <!-- Country flags -->
  <text x="540" y="845" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" letter-spacing="6">🇮🇳  🇦🇪  🇸🇦  🇧🇭  🇴🇲  🇰🇼  🇶🇦</text>

  <!-- ── CORNER DECORATION ── -->
  <circle cx="1050" cy="30" r="60" fill="#3b82f6" opacity="0.12"/>
  <circle cx="30" cy="1050" r="50" fill="#6366f1" opacity="0.1"/>

  <!-- Launch date stamp -->
  <rect x="390" y="942" width="300" height="54" rx="27" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="540" y="976" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#93c5fd">Launched · July 2026</text>
</svg>

</body>
</html>
