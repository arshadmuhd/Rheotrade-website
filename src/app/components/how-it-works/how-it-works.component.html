<section class="how">
  <div class="container">
    <div class="how-header">
      <span class="section-label">How it works</span>
      <h2 class="section-title">Up and running in minutes</h2>
      <p class="section-sub">No implementation partner needed. No 6-month rollout. Just sign up and go.</p>
    </div>
    <div class="steps-grid">
      @for (s of steps; track s.n) {
        <div class="step" appScrollReveal>
          <div class="step-number">{{ s.n }}</div>
          <h3>{{ s.title }}</h3>
          <p>{{ s.body }}</p>
        </div>
      }
    </div>
  </div>
</section>
